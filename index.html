<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menace Boosting</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--bg:#f4f6fb;--card:#fff;--line:#e5e7eb;--brand:#111827;--soft:#eef2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--brand);color:white;position:sticky;top:0;z-index:20}.bar{max-width:1000px;margin:auto;padding:15px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:900}
.wrap{max-width:1000px;margin:auto;padding:16px 14px 90px}.hero{background:linear-gradient(135deg,#111827,#303b5d);color:#fff;border-radius:24px;padding:24px;margin-bottom:15px}.hero h1{margin:0 0 7px;font-size:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 7px 28px #1118270b}.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;background:#111827;color:#fff;cursor:pointer}.btn.soft{background:#eef0f5;color:#111827}.btn.danger{background:#fee2e2;color:#991b1b}.input,select{width:100%;padding:12px;border:1px solid #d8dce5;border-radius:11px;background:#fff;margin:6px 0 11px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef0f5;font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs button{white-space:nowrap}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;display:flex;justify-content:center;gap:4px;padding:8px}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:10px}.nav button.active{background:#eef0f5;font-weight:800}.hidden{display:none!important}.msg{margin-top:10px;background:#f1f4f8;border-radius:11px;padding:10px;white-space:pre-wrap}.service{padding:13px;border:1px solid var(--line);border-radius:14px;margin:8px 0}.price{font-weight:900}.auth{max-width:420px;margin:25px auto}
</style></head><body>
<header><div class="bar"><div class="brand">⚡ Menace Boosting</div><button id="authBtn" class="btn soft" onclick="showAuth()">Login</button></div></header>
<main class="wrap"><section class="hero"><h1>Menace Boosting</h1><div>Mobile-first social media service ordering, wallet and order tracking.</div></section>
<section id="auth" class="card auth hidden"><h2 id="authTitle">Login</h2><input id="email" class="input" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button class="btn" onclick="submitAuth()">Continue</button> <button class="btn soft" onclick="toggleAuth()">Create account</button><div id="authMsg" class="msg hidden"></div></section>
<section id="app" class="hidden"><div id="home"></div><div id="orders" class="hidden"></div><div id="wallet" class="hidden"></div><div id="admin" class="hidden"></div></section></main>
<nav id="nav" class="nav hidden"><button onclick="page('home')">🏠 Home</button><button onclick="page('orders')">📦 Orders</button><button onclick="page('wallet')">💳 Wallet</button><button id="adminTab" class="hidden" onclick="page('admin')">⚙️ Admin</button></nav>
<script>
let token=localStorage.mbtoken,user=null,mode="login",services=[];
const $=x=>document.getElementById(x);
async function api(u,o={}){o.headers={...(o.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(o.body&&typeof o.body!=="string"){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(o.body)}const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
function showAuth(){ $("auth").classList.toggle("hidden") }
function toggleAuth(){mode=mode==="login"?"register":"login";$("authTitle").textContent=mode==="login"?"Login":"Create account"}
async function submitAuth(){try{let d=await api("/api/auth/"+mode,{method:"POST",body:{email:$("email").value,password:$("password").value}});token=d.token;localStorage.mbtoken=token;boot()}catch(e){$("authMsg").textContent=e.message;$("authMsg").classList.remove("hidden")}}
async function boot(){try{user=await api("/api/me");$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("nav").classList.remove("hidden");$("authBtn").textContent="Logout";$("authBtn").onclick=logout;$("adminTab").classList.toggle("hidden",user.role!=="admin");page("home")}catch{logout()}}
function logout(){localStorage.removeItem("mbtoken");location.reload()}
function page(p){["home","orders","wallet","admin"].forEach(x=>$(x).classList.add("hidden"));$(p).classList.remove("hidden");if(p==="home")home();if(p==="orders")orders();if(p==="wallet")wallet();if(p==="admin")admin()}
async function home(){user=await api("/api/me");services=await api("/api/services");$("home").innerHTML=`<div class="grid"><div class="card"><div class="muted">Wallet balance</div><h2>$${(+user.balance).toFixed(2)}</h2><button class="btn" onclick="page('wallet')">Add funds</button></div><div class="card"><div class="muted">Available services</div><h2>${services.length}</h2><button class="btn" onclick="newOrder()">New order</button></div></div><div class="card" style="margin-top:12px"><div class="row"><h2>Services</h2><button class="btn soft" onclick="newOrder()">Order</button></div><div class="tabs" id="cats"></div><div id="serviceList"></div></div>`;renderServices("All")}
function renderServices(cat){$("cats").innerHTML=["All",...new Set(services.map(s=>s.category||"Other"))].map(c=>`<button class="btn soft" onclick="renderServices(${JSON.stringify(c)})">${esc(c)}</button>`).join("");let arr=cat==="All"?services:services.filter(s=>(s.category||"Other")===cat);$("serviceList").innerHTML=arr.slice(0,30).map(s=>`<div class="service"><div class="row"><b>${esc(s.name)}</b><b>$${(+s.rate).toFixed(2)}/1k</b></div><div class="muted">${esc(s.category||"Other")} · ${s.min}-${s.max}${s.refill?" · Refill":""}${s.cancel?" · Cancel":""}</div></div>`).join("")||"No services."}
function newOrder(){let opts=services.map(s=>`<option value="${s.id}">${esc(s.name)} — $${(+s.rate).toFixed(2)}/1k</option>`).join("");$("home").insertAdjacentHTML("afterbegin",`<div class="card" id="orderCard"><h2>New order</h2><select id="svc" class="input">${opts}</select><input id="link" class="input" placeholder="Target URL"><input id="qty" class="input" type="number" placeholder="Quantity"><button class="btn" onclick="place()">Place order</button><button class="btn soft" onclick="document.getElementById('orderCard').remove()">Close</button><div id="om" class="msg hidden"></div></div>`)}
async function place(){try{let d=await api("/api/orders",{method:"POST",body:{serviceId:+$("svc").value,link:$("link").value,quantity:+$("qty").value}});$("om").textContent=`Order #${d.orderId} submitted. Charge $${d.charge.toFixed(4)}`;$("om").classList.remove("hidden")}catch(e){$("om").textContent=e.message;$("om").classList.remove("hidden")}}
async function orders(){let d=await api("/api/orders");$("orders").innerHTML=`<div class="card"><h2>Order history</h2>${d.length?d.map(o=>`<div class="card" style="margin:8px 0"><div class="row"><b>#${o.id} ${esc(o.service_name)}</b><span class="pill">${esc(o.status)}</span></div><div class="muted">${esc(o.link)}</div><div>Qty ${o.quantity} · $${(+o.charge).toFixed(4)}</div><div style="margin-top:8px">${o.cancel?`<button class="btn danger" onclick="cancelOrder(${o.id})">Cancel</button>`:""}${o.refill?` <button class="btn soft" onclick="refillOrder(${o.id})">Refill</button>`:""}</div></div>`).join(""):"No orders yet."}</div>`}
async function cancelOrder(id){try{await api("/api/orders/"+id+"/cancel",{method:"POST"});orders()}catch(e){alert(e.message)}}
async function refillOrder(id){try{await api("/api/orders/"+id+"/refill",{method:"POST"});alert("Refill request sent.");orders()}catch(e){alert(e.message)}}
async function wallet(){user=await api("/api/me");$("wallet").innerHTML=`<div class="card"><h2>Wallet</h2><h1>$${(+user.balance).toFixed(2)}</h1><p class="muted">Submit a deposit request. Admin verifies the payment before crediting your balance.</p><input id="amt" class="input" type="number" placeholder="Amount"><input id="method" class="input" placeholder="Payment method"><input id="ref" class="input" placeholder="Payment reference"><button class="btn" onclick="deposit()">Submit deposit</button><div id="wm" class="msg hidden"></div></div>`}
async function deposit(){try{await api("/api/deposits",{method:"POST",body:{amount:+$("amt").value,method:$("method").value,reference:$("ref").value}});$("wm").textContent="Deposit request submitted.";$("wm").classList.remove("hidden")}catch(e){$("wm").textContent=e.message;$("wm").classList.remove("hidden")}}
async function admin(){let s=await api("/api/admin/summary"),d=await api("/api/admin/deposits");$("admin").innerHTML=`<div class="grid"><div class="card"><div class="muted">Users</div><h2>${s.users}</h2></div><div class="card"><div class="muted">Orders</div><h2>${s.orders}</h2></div><div class="card"><div class="muted">Pending deposits</div><h2>${s.pendingDeposits}</h2></div></div><div class="card" style="margin-top:12px"><h2>Supplier</h2><button class="btn" onclick="sync()">Sync services</button> <button class="btn soft" onclick="balance()">Supplier balance</button><div id="am" class="msg hidden"></div></div><div class="card" style="margin-top:12px"><h2>Deposits</h2>${d.map(x=>`<div class="card"><b>${esc(x.email)}</b> · $${(+x.amount).toFixed(2)} · ${esc(x.status)}<div class="muted">${esc(x.method)} · ${esc(x.reference)}</div>${x.status==="pending"?`<button class="btn" onclick="dep(${x.id},'approve')">Approve</button> <button class="btn soft" onclick="dep(${x.id},'reject')">Reject</button>`:""}</div>`).join("")||"No deposits."}</div>`}
async function sync(){try{let d=await api("/api/admin/sync-services",{method:"POST"});$("am").textContent="Synced "+d.count+" services. Reload Home to see them.";$("am").classList.remove("hidden")}catch(e){$("am").textContent=e.message;$("am").classList.remove("hidden")}}
async function balance(){try{let d=await api("/api/supplier/balance");$("am").textContent=JSON.stringify(d.data,null,2);$("am").classList.remove("hidden")}catch(e){$("am").textContent=e.message;$("am").classList.remove("hidden")}}
async function dep(id,a){await api("/api/admin/deposits/"+id+"/"+a,{method:"POST"});admin()}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
if(token)boot();else showAuth();
</script></body></html>
